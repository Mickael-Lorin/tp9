<nav th:fragment="common-navbar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div style="display: flex; justify-content: space-between; padding: 10px 20px; background-color: #333; color: white; align-items: center;">

        <div>
            <a th:href="@{/movies}" style="color: white; margin-right: 15px; text-decoration: none; font-weight: bold;">🎬 MyMovieApp</a>
        </div>
        <div>
            <span sec:authorize="isAuthenticated()" style="margin-right: 15px;">
                Bonjour, <strong style="color: #4CAF50;" sec:authentication="name">Utilisateur</strong> !
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/movies/new}" style="color: #ff9800; margin-left: 15px; text-decoration: none;">+ Ajouter un film</a>
                <a th:href="@{/logout}" style="color: #ff5252; margin-left: 15px; text-decoration: none;">Déconnexion</a>
            </span>
            <span sec:authorize="isAnonymous()">
                <a th:href="@{/login}" style="color: white; margin-right: 15px; text-decoration: none;">Connexion</a>
                <a th:href="@{/register}" style="color: #4CAF50; text-decoration: none;">Inscription</a>
            </span>
        </div>

    </div>
</nav>
