<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ciné-Club - Connexion</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div class="login-container">
    <h2>Connexion au Ciné-Club</h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        Message d'erreur
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        Vous avez été déconnecté avec succès.
    </div>

    <form th:action="@{/login}" method="post">

        <!-- Champ Email -->
        <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" name="email" placeholder="exemple@ekod.fr" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit">Se connecter</button>
    </form>
</div>

</body>
</html>
