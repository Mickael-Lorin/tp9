<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ciné-Club - Inscription</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="register-container">
    <h2>Créer un compte Ciné-Club</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        Message d'erreur
    </div>

    <!-- Formulaire lié au RegisterRequestDTO via th:object -->
    <form th:action="@{/register}" th:object="${registerRequest}" method="post">

        <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" th:field="*{firstName}" placeholder="Votre prénom" required>
        </div>

        <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" th:field="*{lastName}" placeholder="Votre nom" required>
        </div>

        <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="exemple@ekod.fr" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">S'inscrire</button>
    </form>

    <div class="login-link">
        Déjà inscrit ? <a th:href="@{/login}">Connectez-vous ici</a>
    </div>
</div>

</body>
</html>
